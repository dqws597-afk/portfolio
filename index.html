<style>
:root{
  --ink:#161616;
  --grey:#8a857e;
  --line:#e2ded8;
  --pale:#f2efeb;
  --col:1120px;
  --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--col);margin:0 auto;padding:0 30px}
@media(max-width:560px){.wrap{padding:0 18px}}

.bar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  min-height:50px;padding-top:12px;padding-bottom:12px}
.bar .name{font-family:var(--serif);font-size:15px;letter-spacing:.08em}
.bar nav{display:flex;gap:22px;font-size:12.5px;color:var(--grey);overflow-x:auto;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{white-space:nowrap}
.bar nav a:hover{color:var(--ink)}
@media(max-width:620px){
  .bar .wrap{flex-direction:column;align-items:flex-start;gap:3px;padding-top:9px;padding-bottom:9px}
  .bar nav{gap:15px;width:100%}
}

.masthead{padding:78px 0 0}
.masthead h1{font-family:var(--serif);font-weight:400;
  font-size:clamp(40px,7.2vw,86px);line-height:1.04;letter-spacing:.06em}

.work{padding-top:66px}
.entry{padding-top:22px;border-top:1px solid var(--line)}
.entry .head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.entry h2{font-family:var(--serif);font-weight:400;font-size:clamp(19px,2.6vw,26px);
  line-height:1.4;letter-spacing:.02em}
.entry .tag{margin-left:auto;font-size:12.5px;color:var(--grey);letter-spacing:.04em;white-space:nowrap}
@media(max-width:560px){.entry .tag{margin-left:0}}

.plate{margin-top:26px}
.plate img{width:100%;background:var(--pale)}
.plate img.zoom{cursor:zoom-in}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.pair .plate{margin-top:0}
@media(max-width:700px){.pair{grid-template-columns:1fr}}

.mason{columns:3;column-gap:14px;margin-top:26px}
.mason img{width:100%;margin-bottom:14px;break-inside:avoid;display:block;background:var(--pale);cursor:zoom-in}
@media(max-width:820px){.mason{columns:2}}
@media(max-width:480px){.mason{columns:1}}

.sheet{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-top:26px}
.sheet img{width:100%;background:transparent}
@media(max-width:760px){.sheet{grid-template-columns:repeat(4,1fr)}}

.film{margin-top:26px;max-width:780px}
.film video{width:100%;background:#000;display:block}
.print-only{display:none}

footer{margin-top:86px;border-top:1px solid var(--line);padding:26px 0 60px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:13px;color:var(--grey)}
footer a{color:var(--grey)}
footer a:hover{color:var(--ink)}

#lb{position:fixed;inset:0;z-index:200;background:rgba(12,12,12,.96);
  display:none;align-items:center;justify-content:center;padding:22px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:calc(100vh - 80px);width:auto;height:auto}
#lb .x{position:absolute;top:12px;right:18px;color:#fff;font-size:28px;line-height:1;
  cursor:pointer;opacity:.7;font-family:sans-serif}
#lb .x:hover{opacity:1}
@media(max-width:560px){#lb{padding:10px}#lb img{max-height:calc(100vh - 66px)}}

@media print{
  @page{size:A4;margin:15mm 13mm}
  body{font-size:9.5pt;line-height:1.55}
  .bar{display:none}
  #lb{display:none!important}
  .wrap{max-width:none;padding:0}
  .masthead{padding:0 0 6mm}
  .masthead h1{font-size:26pt}
  .work{padding-top:8mm}
  .entry{padding-top:4mm;page-break-after:avoid}
  .entry h2{font-size:14pt}
  .plate{margin-top:4mm}
  .plate,.plate img{page-break-inside:avoid}
  .pair{gap:4mm;margin-top:4mm}
  .mason{columns:3!important;column-gap:4mm;margin-top:4mm}
  .mason img{margin-bottom:4mm}
  .sheet{grid-template-columns:repeat(8,1fr);gap:2mm;margin-top:4mm}
  .film{max-width:none}
  .film video{display:none}
  .film .print-only{display:block}
  .print-only{display:block}
  footer{margin-top:8mm;padding:4mm 0 0}
}
</style>

<div id="lb" role="dialog" aria-modal="true" aria-label="放大">

<script>
(function(){
  var lb = document.getElementById('lb');
  var lbImg = lb.querySelector('img');
  function open(src, alt){
    lbImg.src = src; lbImg.alt = alt || '';
    lb.classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function close(){
    lb.classList.remove('on'); lbImg.removeAttribute('src'); document.body.style.overflow = '';
  }
  document.querySelectorAll('img.zoom').forEach(function(img){
    img.addEventListener('click', function(){ open(img.currentSrc || img.src, img.alt); });
  });
  lb.addEventListener('click', function(e){
    if (e.target === lb || e.target.classList.contains('x')) close();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && lb.classList.contains('on')) close();
  });
})();
</script>
